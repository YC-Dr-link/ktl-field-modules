name: data-guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/data_guard.py
