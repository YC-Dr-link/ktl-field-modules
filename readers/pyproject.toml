[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktl-readers"
version = "0.1.0"
description = "B-3 사진 판독 모듈 (cert · flowmeter · dust)"
requires-python = ">=3.11"
dependencies = ["ktl-contract"]
# OCR 의존성은 버전을 서버와 맞춘 뒤 추가 (이슈로): rapidocr-onnxruntime, opencv-python-headless, pillow

[tool.setuptools]
packages = ["ktl_readers"]
